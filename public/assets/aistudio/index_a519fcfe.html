<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지금 기분이 어때요? · 감정 책 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1E2A33; --muted:#5E6B75;
  --line:#D5DCE2; --accent:#2F5D62; --accent-ink:#FFFFFF; --shelf:#C9B9A3;
  --mood:#2F5D62; --tint:0%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151C21; --surface:#1E272D; --ink:#E7ECEF; --muted:#9AA7B0;
    --line:#2F3A41; --accent:#7FB3B0; --accent-ink:#10181C; --shelf:#5A4E40;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151C21; --surface:#1E272D; --ink:#E7ECEF; --muted:#9AA7B0;
  --line:#2F3A41; --accent:#7FB3B0; --accent-ink:#10181C; --shelf:#5A4E40;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--ink);
  background:color-mix(in srgb, var(--mood) var(--tint), var(--bg));
  transition:background-color .8s ease;
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:48px 20px 64px}
.view[hidden]{display:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 1단계: 질문 */
h1{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-weight:700;
  font-size:clamp(2.3rem,8vw,3.4rem);line-height:1.15;margin:12px 0 12px;letter-spacing:-0.015em}
.lead{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 260px;font:inherit;font-size:1.1rem;padding:15px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{font-weight:700;font-size:1.02rem;padding:14px 22px;border-radius:12px;border:0;
  background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6;cursor:progress}
.palette-label{margin:36px 0 12px;color:var(--muted);font-size:.95rem}
.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.group{background:var(--surface);border-radius:14px;padding:14px 14px 12px;border-top:5px solid var(--g)}
.group h2{font-family:"Gowun Batang",serif;font-size:1.02rem;margin:0 0 8px}
.group ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.group button{font-size:.9rem;padding:5px 12px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--g) 45%,transparent);
  background:color-mix(in srgb,var(--g) 12%,var(--surface));color:var(--ink)}
.group button:hover{background:var(--g);color:#fff;border-color:var(--g)}

/* 2단계: 기다림 */
.wait{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mini-shelf{display:flex;gap:6px;align-items:flex-end;height:90px;border-bottom:6px solid var(--shelf);padding:0 12px;margin-bottom:24px}
.mini-shelf i{display:block;width:22px;border-radius:3px 3px 0 0;background:var(--accent)}
.mini-shelf i:nth-child(1){height:62px;background:#4A6FA5}
.mini-shelf i:nth-child(2){height:78px;background:#94661A}
.mini-shelf i:nth-child(3){height:54px;background:#7A6A9E}
.mini-shelf i:nth-child(4){height:70px;background:#5E8A7E}
.wait p{font-family:"Gowun Batang",serif;font-size:1.25rem;margin:0}
.wait small{color:var(--muted);margin-top:6px}

/* 3단계: 결과 */
.said{font-family:"Gowun Batang",serif;font-size:clamp(1.5rem,5vw,2rem);line-height:1.3;margin:8px 0 10px;word-break:keep-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{padding:2px 12px;border-radius:999px;color:#fff;font-size:.85rem;font-weight:500}
.empathy{font-size:1.08rem;margin:0 0 28px;padding-left:14px;border-left:3px solid var(--mood)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,22px);align-items:end;
  padding:0 clamp(8px,3vw,24px);border-bottom:10px solid var(--shelf);border-radius:0 0 4px 4px}
.cover{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
  aspect-ratio:2/3;padding:14px 12px 12px 18px;border-radius:3px 8px 8px 3px;color:#fff;background:var(--c);
  box-shadow:inset 7px 0 0 rgba(0,0,0,.22), 0 6px 14px rgba(0,0,0,.18);
  transition:transform .25s ease, box-shadow .25s ease;word-break:keep-all}
.cover:hover{transform:translateY(-4px)}
.cover[aria-pressed="true"]{transform:translateY(-14px);box-shadow:inset 7px 0 0 rgba(0,0,0,.22), 0 16px 26px rgba(0,0,0,.28)}
.cover:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.cover .emo{font-size:.72rem;opacity:.85}
.cover .ttl{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(.88rem,2.7vw,1.15rem);line-height:1.3}
.cover .au{font-size:.72rem;opacity:.9;border-top:1px solid rgba(255,255,255,.4);padding-top:6px}
.shelf-hint{color:var(--muted);font-size:.85rem;margin:10px 0 0;text-align:center}
.detail{background:var(--surface);border-radius:14px;padding:22px;margin-top:22px;border-top:5px solid var(--dc)}
.detail h3{font-family:"Gowun Batang",serif;font-size:1.35rem;margin:0}
.detail .by{color:var(--muted);font-size:.9rem;margin:2px 0 14px}
.detail .why{font-weight:500;margin:0 0 8px}
.detail .sum{color:var(--muted);margin:0 0 16px}
.detail a{display:inline-block;font-weight:700;color:var(--ink);text-decoration:none;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line)}
.detail a:hover{border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.note{color:var(--muted);font-size:.85rem;margin:14px 0 0}
.help{background:var(--surface);border-radius:12px;padding:14px 16px;margin:0 0 24px;font-size:.95rem;border-left:4px solid #B0533D}
.empty{background:var(--surface);border-radius:14px;padding:22px;border:1.5px dashed var(--line)}
.empty p{margin:0 0 8px}
.notice{color:var(--muted);font-size:.82rem;margin:10px 0 0}
.skip{margin-top:22px;font-size:.92rem;padding:10px 16px}
.crisis{background:var(--surface);border-radius:16px;padding:24px 22px;border-top:5px solid #B0533D}
.crisis .said{font-size:1.2rem;color:var(--muted);margin:0 0 6px}
.crisis h2{font-family:"Gowun Batang",serif;font-size:1.5rem;margin:0 0 8px}
.crisis p{margin:0 0 16px}
.crisis .call{display:inline-block;text-decoration:none;background:#B0533D;color:#fff}
.crisis .crisis-sub{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.help a{color:inherit}
.share-panel{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:14px;background:var(--surface);border-radius:12px}
.share-panel[hidden]{display:none}
.sns{font:inherit;font-size:.9rem;font-weight:500;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.sns:hover{border-color:var(--ink)}

.ask-top{display:flex;justify-content:flex-end}
.saved-link{flex:none;white-space:nowrap;font:inherit;font-size:.88rem;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.saved-count{display:inline-block;min-width:1.4em;text-align:center;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 8px}
.r-for{margin:0;color:var(--muted);font-size:.95rem;word-break:keep-all}
.hero{background:var(--surface);border-radius:18px;padding:22px 20px 18px;border-top:6px solid var(--dc);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.hero-label{display:inline-block;margin:0 0 14px;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--dc);border:1.5px dashed var(--dc);border-radius:6px;padding:2px 10px}
.hero-body{display:grid;grid-template-columns:clamp(110px,32vw,150px) 1fr;gap:18px;align-items:start}
.cover{box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:2/3;padding:12px 10px 10px 16px;border-radius:3px 8px 8px 3px;color:#fff;background:var(--c);box-shadow:inset 7px 0 0 rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.2);word-break:keep-all}
.cover .ttl{font-family:"Gowun Batang",serif;font-weight:700;line-height:1.3}
.cover .au{font-size:.7rem;opacity:.9;border-top:1px solid rgba(255,255,255,.4);padding-top:5px}
.cover.big .ttl{font-size:clamp(.95rem,3.4vw,1.2rem)}
.cover.small{width:84px;flex:none;padding:8px 6px 6px 12px}.cover.small .ttl{font-size:.74rem}.cover.small .au{font-size:.6rem}
.cover.tiny{width:56px;flex:none;padding:6px 4px 4px 10px;box-shadow:inset 5px 0 0 rgba(0,0,0,.22)}.cover.tiny .ttl{font-size:.55rem}.cover.tiny .au{display:none}
.h-title{font-family:"Gowun Batang",serif;font-size:clamp(1.3rem,4.6vw,1.6rem);line-height:1.25;margin:0 0 4px;word-break:keep-all}
.h-meta{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.why-label{font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 2px}
.why{font-size:1.02rem;font-weight:500;margin:0;line-height:1.55}
.hero .sum{color:var(--muted);font-size:.92rem;margin:14px 0 0}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero-actions .btn{flex:1 1 180px;text-align:center;text-decoration:none}
.btn.save[aria-pressed="true"]{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:7px 14px;font-size:.88rem;border-radius:999px}
.fb{display:flex;gap:6px;margin-top:12px}
.fbb{font:inherit;font-size:.8rem;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.fbb[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.also{font-family:"Gowun Batang",serif;font-size:1.1rem;margin:30px 0 12px}
.side{display:grid;gap:12px}
.mini{display:flex;gap:14px;background:var(--surface);border-radius:14px;padding:14px}
.mini h4{font-family:"Gowun Batang",serif;font-size:1.05rem;margin:0 0 2px;word-break:keep-all}
.mini .h-meta{margin-bottom:6px}
.mini-why{margin:0 0 10px;font-size:.92rem}
.mini-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.text-link{font:inherit;font-size:.86rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer}
.saved-title{font-family:"Gowun Batang",serif;font-size:1.6rem;margin:10px 0 18px}
.saved-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.saved-item{display:flex;gap:14px;background:var(--surface);border-radius:12px;padding:12px}
.saved-item .h-meta{margin:2px 0 6px}
@media (prefers-reduced-motion:no-preference){
  .hero{animation:slide .45s ease both}.mini{animation:slide .45s ease both}
  .mini:nth-child(1){animation-delay:.12s}.mini:nth-child(2){animation-delay:.22s}
}
.shelf-cover{position:relative}
.shelf-cover .pick{position:absolute;top:-11px;left:12px;font-size:.68rem;font-weight:700;background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
.shelf-cover .saved-mark{position:absolute;right:6px;top:6px;font-size:.62rem;font-weight:700;background:rgba(255,255,255,.9);color:#1E2A33;border-radius:999px;padding:1px 6px}
.shelf-cover .saved-mark[hidden]{display:none}
.shelf{margin-top:18px}
#detail .hero{margin-top:22px}

/* v0.5.3 UX 개선 */
.shelf{grid-template-columns:repeat(3,minmax(0,1fr));max-width:540px;margin-left:auto;margin-right:auto}              /* UX-01, UX-02 */
.shelf-hint{margin:12px 0 18px}                                                  /* UX-05 */
#detail .hero{margin-top:0}
.r-top{flex-wrap:wrap}
.r-top .saved-link{order:-1;margin-left:auto}
.r-for{display:flex;min-width:0;flex:1 1 100%}                                   /* UX-04 */
.r-for .r-q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-for .r-s{flex:none;white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}     /* UX-03 */
.actions .btn{padding:12px 10px;font-size:.95rem;text-align:center}
@media (max-width:560px){ .actions{grid-template-columns:1fr} }
.actions:has(> :only-child){grid-template-columns:1fr}
.hero-actions .sm{display:none}                                                  /* UX-08 */
@media (max-width:380px){ .hero-actions .lg{display:none} .hero-actions .sm{display:inline} }
.shelf-cover.pat0{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px)}   /* UX-06 */
.shelf-cover.pat1{background-image:linear-gradient(to bottom,transparent 58%,rgba(255,255,255,.16) 58%,rgba(255,255,255,.16) 66%,transparent 66%)}
.shelf-cover.pat2{background-image:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.6px);background-size:10px 10px}
.shelf-cover{overflow:hidden}
.shelf-cover img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shelf-cover.has-img .ttl,.shelf-cover.has-img .au{visibility:hidden}
.shelf-cover .saved-mark{z-index:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
footer{margin-top:48px;color:var(--muted);font-size:.78rem}

@media (prefers-reduced-motion:no-preference){
  .mini-shelf i{animation:bob 1.1s ease-in-out infinite}
  .mini-shelf i:nth-child(2){animation-delay:.15s}.mini-shelf i:nth-child(3){animation-delay:.3s}.mini-shelf i:nth-child(4){animation-delay:.45s}
  @keyframes bob{50%{transform:translateY(-12px)}}
  .shelf .cover{animation:slide .5s ease both}
  .shelf .cover:nth-child(2){animation-delay:.1s}.shelf .cover:nth-child(3){animation-delay:.2s}
  @keyframes slide{from{opacity:0;transform:translateY(24px)}}
}
@media (prefers-reduced-motion:reduce){ body,.cover{transition:none} }
</style>
</head>
<body>
<main>
  <!-- 1단계 -->
  <section class="view" id="v-ask">
    <div class="ask-top"><button type="button" class="saved-link" id="openSaved0">읽고 싶은 책 <span class="saved-count">0</span></button></div>
    <h1>지금 기분이<br>어때요?</h1>
    <p class="lead">느끼는 그대로 적으면, 그 마음에 맞는 책 3권을 골라 드려요.</p>
    <form id="f" autocomplete="off">
      <label for="q" style="position:absolute;left:-9999px">지금 기분</label>
      <input id="q" placeholder="예: 요즘 너무 지쳐" maxlength="100">
      <button class="btn" id="go" type="submit">내 마음에 맞는 책 보기</button>
    </form>
    <p class="notice">입력한 문장은 책 추천을 위해 AI로 전송되며, 이 페이지에 저장되지 않아요.</p>
    <p class="palette-label">또는 지금 감정을 골라 보세요</p>
    <div class="palette" id="palette"></div>
  </section>

  <!-- 2단계 -->
  <section class="view wait" id="v-wait" hidden aria-live="polite">
    <div class="mini-shelf" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p>마음을 읽고 책을 고르는 중이에요…</p>
    <small>잠시만 기다려 주세요</small>
  </section>

  <!-- 3단계 -->
  <section class="view" id="v-result" hidden aria-live="polite"></section>
  <section class="view" id="v-saved" hidden></section>

  <footer>v0.7 · AI가 입력한 문장 속 감정을 읽고, 준비된 도서 목록 안에서 3권을 골라 드려요.<br>도서 표지·상품 정보 제공: <a href="https://www.aladin.co.kr" target="_blank" rel="noopener" style="color:inherit">알라딘</a></footer>
</main>

<script>

/* [개선 3] 기본 방식: 부정 표현·다른 뜻 단어 처리 */
const EXCLUDE = ["썸네일","썸머","썸바디","좋아요","화가가그린","화가의","화가는"];
function negated(s, i, len){
  const before=s.slice(Math.max(0,i-1), i);           // 바로 앞: 안, 못
  const after=s.slice(i+len, i+len+4);                // 바로 뒤: ~지 않, ~지 못, ~지 마
  return before==="안" || before==="못" || /^.{0,2}지(않|못|마)/.test(after);
}
function findEmotions(input){
  let s=input.replace(/\s+/g,"");
  EXCLUDE.forEach(x=>{ s=s.split(x).join("#".repeat(x.length)); });
  const hits=[];
  EMOS.forEach(e=>{
    let pos=-1;
    e.words.forEach(w=>{
      const k=w.replace(/\s+/g,""); let from=0, i;
      while((i=s.indexOf(k,from))>=0){
        if(k==="화가" && !/^(나|났|치밀|난)/.test(s.slice(i+2,i+4))){ from=i+1; continue; }
        if(!negated(s,i,k.length)){ if(pos<0||i<pos) pos=i; break; }
        from=i+1;
      }
    });
    if(pos>=0) hits.push({e,pos});
  });
  return hits.sort((a,b)=>a.pos-b.pos).map(h=>h.e);
}

/* [개선 2] 책 선택은 코드 규칙으로 고정 */
function candidates(names, exclude){
  const score=b=>b.tags.filter(t=>names.includes(t)).length;
  const sorted=[...names].sort((a,b)=>EMO_ORDER[a]-EMO_ORDER[b]);
  const out=[];
  // 1) 두 감정 이상에 겹치는 책
  CATALOG.filter(b=>score(b)>1).sort((a,b)=>score(b)-score(a)).forEach(b=>out.push(b.id));
  // 2) 감정 순서대로 각 감정의 대표 책을 1권씩 돌아가며
  for(let r=0;r<3;r++) sorted.forEach(n=>{ const id=EMO_BY_NAME[n].ids[r]; if(id&&!out.includes(id)) out.push(id); });
  // 3) 같은 감정 태그가 붙은 나머지 책
  CATALOG.filter(b=>score(b)>0&&!out.includes(b.id)).forEach(b=>out.push(b.id));
  // 4) 같은 감정 묶음의 다른 감정 책
  const groupEmos=[...new Set(sorted.flatMap(n=>GROUP_OF[n].emos))].filter(n=>!names.includes(n));
  groupEmos.forEach(n=>EMO_BY_NAME[n].ids.forEach(id=>{ if(!out.includes(id)) out.push(id); }));
  const res=out.filter(id=>!(exclude||[]).includes(id));
  const sens=CATALOG.filter(b=>/죽고\s*싶/.test(b.t)).map(b=>b.id);
  if(res.length>1 && sens.includes(res[0])){ const s=res.shift(); res.splice(2,0,s); }
  return res;
}

const cleanLine=(s,max)=>{ s=typeof s==="string"?s.trim().slice(0,max):""; return (!s||BANNED.test(s))?"":s; };

/* [v0.5.2] 장르 (책 정보 보강) */
const GENRE={"죽고 싶지만 떡볶이는 먹고 싶어":"에세이","미드나잇 라이브러리":"소설","어린 왕자":"소설","아몬드":"소설","언어의 온도":"에세이","우리가 빛의 속도로 갈 수 없다면":"SF 소설","모순":"소설","불안":"인문","미움받을 용기":"인문·심리","나는 나로 살기로 했다":"에세이","자존감 수업":"심리","당신이 옳다":"심리","마음챙김의 시":"시","불편한 편의점":"소설","달러구트 꿈 백화점":"판타지 소설","나미야 잡화점의 기적":"소설","어서 오세요, 휴남동 서점입니다":"소설","스토너":"소설","지구 끝의 온실":"SF 소설","화":"명상·심리","감정은 습관이다":"심리","데미안":"고전 소설","하마터면 열심히 살 뻔했다":"에세이","아주 작은 습관의 힘":"자기계발","월든":"고전 에세이","그릿":"심리·자기계발","노인과 바다":"고전 소설","꾸뻬 씨의 행복 여행":"소설","행복의 기원":"심리","연금술사":"소설","빨강 머리 앤":"고전 소설","모모":"소설","사랑의 기술":"인문","왜 나는 너를 사랑하는가":"소설","오만과 편견":"고전 소설","너의 췌장을 먹고 싶어":"소설","위대한 개츠비":"고전 소설","냉정과 열정 사이":"소설","엄마를 부탁해":"소설","숨결이 바람 될 때":"에세이","모리와 함께한 화요일":"에세이","작별하지 않는다":"소설","연을 쫓는 아이":"소설"};
/* 감정별로 써 둔 추천 이유 (AI 이유가 없을 때 사용) */
const EMO_REASON={}; (typeof V3DATA!=="undefined"?V3DATA:[]).forEach(e=>e.books.forEach(b=>{ EMO_REASON[e.name+"|"+b.t]=b.r; }));

/* [v0.5.2] 읽고 싶은 책 담기·반응 (이 브라우저에만 저장) */
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let saved=store.get("mb_saved",[]).filter(id=>BY_ID[id]);
let feedback=store.get("mb_feedback",{});
function isSaved(id){ return saved.includes(id); }
function toggleSave(id){
  saved=isSaved(id)?saved.filter(x=>x!==id):[id,...saved];
  store.set("mb_saved",saved);
  toast(isSaved(id)?"읽고 싶은 책에 담았어요":"담은 책에서 뺐어요");
  updateSavedCount();
}
function setFeedback(id,v){
  feedback[id]=feedback[id]===v?0:v; store.set("mb_feedback",feedback);
  toast(feedback[id]===1?"끌린다고 남겼어요":feedback[id]===-1?"다음 추천에서는 뒤로 미룰게요":"반응을 지웠어요");
}
function updateSavedCount(){
  document.querySelectorAll("#v5 .saved-count").forEach(el=>{ el.textContent=saved.length; });
  document.querySelectorAll("#v5 [data-save]").forEach(btn=>{
    const on=isSaved(btn.dataset.save);
    btn.setAttribute("aria-pressed",String(on));
    btn.querySelector(".lbl").textContent=on?"담은 책이에요":(btn.classList.contains("small")?"담기":"읽고 싶은 책에 담기");
  });
  document.querySelectorAll("#v5 [data-mark]").forEach(m=>{ m.hidden=!isSaved(m.dataset.mark); });
  document.querySelectorAll("#v5 [data-fb]").forEach(btn=>{
    const [id,v]=btn.dataset.fb.split("|"); btn.setAttribute("aria-pressed",String(feedback[id]===+v));
  });
}
function reasonFor(id, emoNames){
  const b=BY_ID[id], ai=current&&current.reasons&&current.reasons[id];
  if(ai) return ai;
  for(const n of emoNames){ const r=EMO_REASON[n+"|"+b.t]; if(r) return r; }
  const any=b.tags.map(n=>EMO_REASON[n+"|"+b.t]).find(Boolean);
  return any||b.s;
}
function storeLink(b){
  const q=encodeURIComponent(b.t+" "+b.a.split("·")[0].replace(" 엮음",""));
  return `https://search.kyobobook.co.kr/search?keyword=${q}`;
}
function coverHTML(id, emoNames, cls){
  const b=BY_ID[id], emo=emoFor(b, emoNames);
  return `<div class="cover ${cls}" style="--c:${colorOf(emo)}" aria-hidden="true"><span class="ttl">${esc(b.t)}</span><span class="au">${esc(b.a)}</span></div>`;
}

/* 결과 그리기 */
let current=null;
function render(input, emoNames, ids, reasons, empathy, note, crisisMode){
  const pool=candidates(emoNames, crisisMode?CRISIS_EXCLUDE:[]);
  // 별로예요를 누른 책은 뒤로
  const ordered=[...pool.filter(id=>feedback[id]!==-1), ...pool.filter(id=>feedback[id]===-1)];
  current={input, emoNames, reasons, empathy, note, crisisMode, page:0, pool:ordered, ids:ids||ordered.slice(0,3)};
  drawResult();
}
function drawResult(){
  const {input, emoNames, ids, empathy, note, crisisMode}=current;
  setMood(colorOf(emoNames[0]));
  const tags=emoNames.map(n=>`<span class="tag" style="background:${colorOf(n)}">${esc(n)}</span>`).join("");
  const more=current.pool.length>3;
  const covers=ids.map((id,i)=>{
    const b=BY_ID[id], emo=emoFor(b, emoNames);
    const shade=["0%","18%","32%"][i];
    return `<button class="cover shelf-cover pat${i}" type="button" data-i="${i}" aria-pressed="${i===0}" style="--c:color-mix(in srgb, ${colorOf(emo)}, #1a1a1a ${shade})">
      <span class="ttl">${esc(b.t)}</span><span class="au">${esc(b.a)}</span>
      <img class="real" alt="" data-cover="${id}" hidden>
      <span class="saved-mark" data-mark="${id}" hidden>담음</span></button>`;
  }).join("");
  views.result.innerHTML=`
    <div class="r-top">
      <p class="r-for" title="${esc(input)}"><span class="r-q">‘${esc(input)}</span><span class="r-s">’에 맞춘 오늘의 마음 처방</span></p>
      <button type="button" class="saved-link" id="openSaved">읽고 싶은 책 <span class="saved-count">${saved.length}</span></button>
    </div>
    <div class="tags">${tags}</div>
    ${crisisMode?`<div class="help">힘든 마음이 계속되면 혼자 견디지 말고 자살예방상담전화 <a href="tel:109"><strong>109</strong></a>(24시간, 무료)에 이야기해 보세요.</div>`:""}
    <p class="empathy">${esc(empathy)}</p>
    <div class="shelf" role="group" aria-label="추천 책 3권">${covers}</div>
    <p class="shelf-hint">책을 눌러 고른 이유를 확인해 보세요</p>
    <div id="detail"></div>
    <div class="actions">
      ${more?`<button class="btn ghost" type="button" id="moreBooks">다른 책 보기</button>`:""}
      <button class="btn ghost" type="button" id="again">다른 기분으로 다시 찾기</button>
      <button class="btn ghost" type="button" id="share" aria-expanded="false" aria-controls="sharePanel">결과 공유하기</button>
    </div>
    <div class="share-panel" id="sharePanel" hidden></div>
    ${note?`<p class="note">${esc(note)}</p>`:""}`;
  views.result.querySelectorAll(".shelf-cover").forEach(c=>c.addEventListener("click",()=>openBook(+c.dataset.i)));
  $("again").addEventListener("click",()=>{ setMood(null); $("q").value=""; show("ask"); $("q").focus(); });
  $("share").addEventListener("click",share);
  $("openSaved").addEventListener("click",()=>showSaved("result"));
  if(more) $("moreBooks").addEventListener("click",nextPage);
  openBook(0);
  show("result");
  loadCovers();
}
/* 알라딘 표지 (서버에 ALADIN_TTB_KEY가 있을 때만), 실패하면 디자인 표지 유지 */
const coverCache={};
function getCover(id){
  if(id in coverCache) return coverCache[id];
  const b=BY_ID[id];
  coverCache[id]=fetch(`/api/cover?title=${encodeURIComponent(b.t)}&author=${encodeURIComponent(b.a)}`)
    .then(r=>r.ok?r.json():null).catch(()=>null);
  return coverCache[id];
}
function loadCovers(){
  document.querySelectorAll("img.real[data-cover]").forEach(async img=>{
    const info=await getCover(img.dataset.cover);
    if(!info||!info.cover) return;
    img.onload=()=>{ img.hidden=false; img.parentElement.classList.add("has-img"); };
    img.src=info.cover;
  });
}
function openBook(i){
  const {emoNames,ids}=current, id=ids[i], b=BY_ID[id];
  const emo=emoFor(b, emoNames);
  views.result.querySelectorAll(".shelf-cover").forEach(c=>c.setAttribute("aria-pressed", String(+c.dataset.i===i)));
  const why=reasonFor(id,emoNames);
  $("detail").innerHTML=`<article class="hero" style="--dc:${colorOf(emo)}">
      <h2 class="h-title">${esc(b.t)}</h2>
      <p class="h-meta">${esc(b.a)}${GENRE[b.t]?` · ${esc(GENRE[b.t])}`:""}</p>
      <p class="why-label">이 책을 고른 이유</p>
      <p class="why">${esc(why)}</p>
      ${why!==b.s?`<p class="sum">${esc(b.s)}</p>`:""}
      <div class="hero-actions">
        <button type="button" class="btn save" data-save="${id}" aria-pressed="false"><span class="lbl">읽고 싶은 책에 담기</span></button>
        <a class="btn ghost" id="buyLink" href="${storeLink(b)}" target="_blank" rel="noopener"><span class="lg">온라인 서점에 구매하러 가기</span><span class="sm">서점에서 구매하기</span></a>
      </div>
      <div class="fb" role="group" aria-label="이 추천 어때요?">
        <button type="button" class="fbb" data-fb="${id}|1" aria-pressed="false">끌려요</button>
        <button type="button" class="fbb" data-fb="${id}|-1" aria-pressed="false">별로예요</button></div>
    </article>`;
  getCover(id).then(info=>{ const a=$("buyLink"); if(a&&info&&info.link) a.href=info.link; });
  $("detail").querySelector("[data-save]").addEventListener("click",e=>toggleSave(e.currentTarget.dataset.save));
  $("detail").querySelectorAll("[data-fb]").forEach(btn=>btn.addEventListener("click",()=>{ const [x,v]=btn.dataset.fb.split("|"); setFeedback(x,+v); updateSavedCount(); }));
  updateSavedCount();
}
/* 같은 감정 안에서 다른 3권 */
function nextPage(){
  const pool=current.pool, pages=Math.ceil(pool.length/3);
  current.page=(current.page+1)%pages;
  let ids=pool.slice(current.page*3, current.page*3+3);
  for(let i=0; ids.length<3 && i<pool.length; i++) if(!ids.includes(pool[i])) ids.push(pool[i]);
  current.ids=ids;
  drawResult();
}
/* 읽고 싶은 책 목록 */
let savedBack="ask";
function showSaved(from){
  savedBack=from;
  const list=saved.map(id=>{ const b=BY_ID[id]; return `<li class="saved-item">
      ${coverHTML(id, b.tags, "tiny")}
      <div><strong>${esc(b.t)}</strong><p class="h-meta">${esc(b.a)}${GENRE[b.t]?` · ${esc(GENRE[b.t])}`:""}</p>
      <div class="mini-actions"><a class="text-link" href="${storeLink(b)}" target="_blank" rel="noopener">온라인 서점에 구매하러 가기</a>
      <button type="button" class="text-link rm" data-rm="${id}">빼기</button></div></div></li>`; }).join("");
  views.saved.innerHTML=`<h2 class="saved-title">읽고 싶은 책 <span class="saved-count">${saved.length}</span></h2>
    ${saved.length?`<ul class="saved-list">${list}</ul>`:`<div class="empty"><p>아직 담은 책이 없어요.</p><p>추천 결과에서 마음에 드는 책을 담아 보세요.</p></div>`}
    <p class="note">담은 책은 이 브라우저에만 저장돼요.</p>
    <div class="actions"><button class="btn" type="button" id="savedBack">${from==="result"?"추천 결과로 돌아가기":"처음으로"}</button></div>`;
  views.saved.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ toggleSave(b.dataset.rm); showSaved(savedBack); }));
  $("savedBack").addEventListener("click",()=>{ if(savedBack==="result"&&current){ drawResult(); } else show("ask"); });
  show("saved");
}

/* SNS 공유 */
const SHARE_URL=location.origin+location.pathname;
function shareText(){ const {input,ids}=current; return `‘${input}’ 마음에 추천받은 책: `+ids.map(id=>BY_ID[id].t).join(", "); }
function share(){
  const box=$("sharePanel");
  if(!box.hidden){ box.hidden=true; $("share").setAttribute("aria-expanded","false"); return; }
  const u=encodeURIComponent(SHARE_URL), tx=encodeURIComponent(shareText());
  const links=[
    ["X (트위터)",`https://twitter.com/intent/tweet?text=${tx}&url=${u}`],
    ["페이스북",`https://www.facebook.com/sharer/sharer.php?u=${u}`],
    ["네이버 블로그·카페",`https://share.naver.com/web/shareView.nhn?url=${u}&title=${tx}`]
  ];
  box.innerHTML=links.map(([n,h])=>`<a class="sns" href="${h}" target="_blank" rel="noopener">${n}</a>`).join("")
    +`<button class="sns" type="button" id="copyLink">링크 복사</button>`;
  $("copyLink").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(shareText()+"\n"+SHARE_URL); toast("링크를 복사했어요"); }catch(e){ toast("이 화면에서는 복사할 수 없어요"); } });
  box.hidden=false; $("share").setAttribute("aria-expanded","true");
}
function renderEmpty(input){
  setMood(null);
  views.result.innerHTML=`<div class="empty"><p><strong>‘${esc(input)}’에서 감정을 찾지 못했어요.</strong></p>
    <p>“요즘 너무 지쳐”처럼 지금 느끼는 마음을 적거나, 감정 팔레트에서 골라 보세요.</p></div>
    <div class="actions"><button class="btn" type="button" id="again">다시 적어 보기</button></div>`;
  $("again").addEventListener("click",()=>{ show("ask"); $("q").focus(); });
  show("result");
}
/* [개선 1] 위기 안내 화면: 책보다 먼저 */
function renderCrisis(input, proceed){
  setMood(null);
  views.result.innerHTML=`<div class="crisis">
    <p class="said">‘${esc(input)}’</p>
    <h2>지금 많이 힘드신 것 같아요.</h2>
    <p>혼자 견디지 않아도 괜찮아요. 지금 바로 이야기를 들어 줄 사람이 있어요.</p>
    <a class="btn call" href="tel:109">자살예방상담전화 109에 전화하기</a>
    <p class="crisis-sub">24시간, 무료로 상담받을 수 있어요.</p>
    <div class="actions">
      <button class="btn ghost" type="button" id="cBooks">그래도 책 보기</button>
      <button class="btn ghost" type="button" id="again">처음으로</button>
    </div></div>`;
  $("cBooks").addEventListener("click",proceed);
  $("again").addEventListener("click",()=>{ $("q").value=""; show("ask"); $("q").focus(); });
  show("result");
}
function fallbackResult(input){
  const emos=findEmotions(input).slice(0,3);
  if(!emos.length) return null;
  const names=emos.map(e=>e.name);
  return {names, empathy:GROUP_OF[names[0]].line, reasons:{}};
}

/* [개선 5] 시간 제한 + 기본 방식으로 보기 */
let busy=false;

async function getRecommendation(input, quiet){
  if(!quiet) show("wait");
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(), AI_TIMEOUT_MS);
  try{
    const res=await fetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:input}),signal:ctl.signal});
    if(!res.ok) throw {code: res.status===429?"rate_limited":"server"};
    const data=await res.json();
    const names=(Array.isArray(data.emotions)?data.emotions:[]).filter(n=>EMO_BY_NAME[n]).slice(0,3);
    if(!names.length) return {names:[], aiCrisis:data.crisis===true};
    const reasons={};
    if(data.reasons&&typeof data.reasons==="object") Object.entries(data.reasons).forEach(([id,r])=>{ if(BY_ID[id]){ const c=cleanLine(r,80); if(c) reasons[id]=c; } });
    return {names, reasons, empathy:cleanLine(data.empathy,120)||GROUP_OF[names[0]].line, aiCrisis:data.crisis===true};
  }catch(e){
    let note="AI 응답에 문제가 있어 기본 방식으로 골랐어요.";
    if(e&&e.code==="rate_limited") note="요청이 많아 잠시 기본 방식으로 골랐어요. 잠시 뒤 다시 시도해 보세요.";
    else if(e&&e.name==="AbortError") note="AI 응답이 늦어 기본 방식으로 골랐어요.";
    const fb=fallbackResult(input);
    return fb?{...fb, note, aiCrisis:false}:null;
  }finally{ clearTimeout(timer); }
}

async function run(raw){
  const input=raw.trim();
  if(!input){ $("q").focus(); return; }
  if(busy) return;
  busy=true; $("go").disabled=true;
  try{
    const keywordCrisis=CRISIS.test(input);
    const go=(r)=>{
      if((!r||!r.names.length) && (keywordCrisis||(r&&r.aiCrisis))) r={...(r||{}), names:["우울"], reasons:(r&&r.reasons)||{}, empathy:"지금 마음이 많이 무거우신 것 같아요. 천천히 곁에 둘 만한 책을 골랐어요."};
      if(!r||!r.names.length){ renderEmpty(input); return; }
      render(input, r.names, null, r.reasons, r.empathy, r.note, keywordCrisis||r.aiCrisis);
    };
    if(keywordCrisis){
      // 위기 표현은 AI를 기다리지 않고 안내 화면부터
      let done=null;
      const pending=getRecommendation(input, true).then(r=>(done={r}));
      renderCrisis(input, async()=>{ if(!done){ show("wait"); await pending; } go(done.r); });
      await pending; return;
    }
    const r=await getRecommendation(input);
    if(r&&r.aiCrisis){ renderCrisis(input, ()=>go(r)); return; }
    go(r);
  }finally{ busy=false; $("go").disabled=false; }
}
$("openSaved0").addEventListener("click",()=>showSaved("ask"));
updateSavedCount();
$("f").addEventListener("submit",e=>{e.preventDefault();run($("q").value);});
show("ask");

</script>
